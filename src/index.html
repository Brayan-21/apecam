<!doctype html>
<html lang="pt-br" [class]="tema">
<head>
  <meta charset="utf-8">
  <title>Apecam</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon laranja.png">
  <!-- Google Fonts: Inter - moderna e amigável para ONGs -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Google Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <!-- VLibras: Widget de Acessibilidade em Libras -->
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
</head>
<body>
  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <app-root></app-root>
  <script>
    // Inicialização do VLibras (sem defer para garantir ordem de carregamento)
    if (window.VLibras) {
      new window.VLibras.Widget('https://vlibras.gov.br/app');
    } else {
      window.addEventListener('load', function(){
        if (window.VLibras) new window.VLibras.Widget('https://vlibras.gov.br/app');
      });
    }
  </script>
</body>
</html>

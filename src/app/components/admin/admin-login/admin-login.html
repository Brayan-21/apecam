<section class="admin-login">
    <a class="back-link" routerLink="/">← Voltar para o site</a>

    <app-alert
        [type]="alertType"
        [message]="alertMessage"
        [show]="alertShow"
        [autoClose]="true"
        [autoCloseDelay]="5000"
        (closed)="onAlertClosed()">
    </app-alert>

    <div class="card">
        <div class="header">
            <h1>Área Administrativa</h1>
            <p>Faça login com seu CPF e senha para acessar o painel da APECAM.</p>
        </div>

        <form (ngSubmit)="onSubmit()" #loginForm="ngForm" novalidate autocomplete="off">
            <label class="form-label" for="cpf">CPF</label>
            <input
                id="cpf"
                name="cpf"
                type="tel"
                class="form-input"
                placeholder="000.000.000-00"
                maxlength="14"
                [(ngModel)]="cpf"
                (input)="onCpfInput($event)"
                (keydown)="onCpfKeydown($event)"
                (paste)="onCpfPaste($event)"
                required
                inputmode="numeric"
                autocomplete="off"
                autocapitalize="off"
                autocorrect="off"
                spellcheck="false"
                [disabled]="carregando"
            >

            <label class="form-label" for="senha">Senha</label>
            <div class="input-wrapper">
                <input
                    id="senha"
                    name="senha"
                    [type]="mostrarSenha ? 'text' : 'password'"
                    class="form-input"
                    placeholder="Informe sua senha"
                    [(ngModel)]="senha"
                    required
                    autocomplete="new-password"
                    [disabled]="carregando"
                >
                <button type="button" class="toggle-visibility" (click)="alternarSenha()" [attr.aria-pressed]="mostrarSenha" aria-label="Mostrar senha">
                    <span class="material-icons">{{ mostrarSenha ? 'visibility_off' : 'visibility' }}</span>
                </button>
            </div>

            <button class="btn-primary" type="submit" [disabled]="loginForm.invalid || carregando">
                <span *ngIf="!carregando">Entrar</span>
                <span *ngIf="carregando" class="spinner"></span>
            </button>
        </form>
    </div>
</section>

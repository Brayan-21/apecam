<app-alert
    [type]="alertType"
    [message]="alertMessage"
    [show]="alertShow"
    [autoClose]="true"
    [autoCloseDelay]="5000"
    (closed)="onAlertClosed()">
</app-alert>

<div class="noticia-detalhe-container">
    <header class="detalhe-header">
        <div class="header-top">
            <button class="btn-voltar" (click)="voltar()" type="button">
                <span class="material-icons">arrow_back</span>
                Voltar
            </button>
            <h1>{{ modoEdicao ? 'Editar Notícia' : 'Nova Notícia' }}</h1>
        </div>
        <p class="header-subtitle">Preencha os campos abaixo para {{ modoEdicao ? 'editar' : 'criar' }} a notícia</p>
    </header>

    <div class="loading-state" *ngIf="carregando">
        <div class="spinner"></div>
        <p>Carregando notícia...</p>
    </div>

    <form class="noticia-form" *ngIf="!carregando" (ngSubmit)="salvar()" #noticiaForm="ngForm">
        <div class="form-section">
            <label class="form-label" for="titulo">
                Título da Notícia
                <span class="required">*</span>
            </label>
            <input
                id="titulo"
                name="titulo"
                type="text"
                class="form-input"
                placeholder="Digite o título da notícia"
                [(ngModel)]="noticia.titulo"
                required
                [disabled]="salvando"
                maxlength="200"
            />
            <span class="form-hint">Máximo de 200 caracteres</span>
        </div>

        <div class="form-section">
            <label class="form-label" for="imagem">
                Imagem da Notícia
            </label>
            <div class="imagem-upload-container">
                <div class="imagem-preview" *ngIf="noticia.imagem && noticia.imagem.trim() !== ''">
                    <div class="imagem-wrapper">
                        <img [src]="noticia.imagem" alt="Preview da imagem" (error)="onImagemError($event)" />
                    </div>
                    <button type="button" class="btn-remover-imagem" (click)="removerImagem()" [disabled]="salvando" title="Remover imagem">
                        <span class="material-icons">close</span>
                    </button>
                </div>
                <div class="upload-area" *ngIf="!noticia.imagem || noticia.imagem.trim() === ''">
                    <input
                        type="file"
                        id="imagem"
                        name="imagem"
                        accept="image/webp,.webp"
                        (change)="onImagemChange($event)"
                        [disabled]="salvando"
                        class="file-input"
                    />
                    <label for="imagem" class="upload-label">
                        <span class="material-icons">upload</span>
                        <span>Clique para fazer upload ou arraste uma imagem</span>
                        <small>Apenas WEBP até 5MB</small>
                    </label>
                </div>
            </div>
        </div>

        <div class="form-section">
            <label class="form-label" for="descricao">
                Descrição da Notícia
                <span class="required">*</span>
            </label>
            <textarea
                id="descricao"
                name="descricao"
                class="form-textarea"
                placeholder="Digite a descrição da notícia. Você pode incluir links usando HTML ou texto simples."
                [(ngModel)]="noticia.descricao"
                required
                [disabled]="salvando"
                rows="12"
            ></textarea>
            <span class="form-hint">
                Suporta links HTML. Exemplo: &lt;a href="https://exemplo.com"&gt;Link&lt;/a&gt;
            </span>
        </div>

        <div class="form-actions">
            <button type="button" class="btn-secondary" (click)="voltar()" [disabled]="salvando">
                Cancelar
            </button>
            <button type="submit" class="btn-primary" [disabled]="salvando || !noticiaForm.valid">
                <span *ngIf="!salvando">{{ modoEdicao ? 'Atualizar' : 'Criar' }} Notícia</span>
                <span *ngIf="salvando">
                    <span class="spinner-small"></span>
                    Salvando...
                </span>
            </button>
        </div>
    </form>
</div>

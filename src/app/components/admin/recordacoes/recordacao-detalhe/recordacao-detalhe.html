<app-alert
    [type]="alertType"
    [message]="alertMessage"
    [show]="alertShow"
    [autoClose]="true"
    [autoCloseDelay]="5000"
    (closed)="onAlertClosed()">
</app-alert>

<div class="noticia-detalhe-container">
    <header class="detalhe-header">
        <div class="header-top">
            <button class="btn-voltar" (click)="voltar()" type="button">
                <span class="material-icons">arrow_back</span>
                Voltar
            </button>
            <h1>Nova Recordação</h1>
        </div>
        <p class="header-subtitle">Faça upload de uma imagem para adicionar à galeria de recordações</p>
    </header>

    <form class="noticia-form" (ngSubmit)="salvar()" #recordacaoForm="ngForm">
        <div class="form-section">
            <label class="form-label" for="imagem">
                Imagem da Recordação
                <span class="required">*</span>
            </label>
            <div class="imagem-upload-container">
                <div class="imagem-preview" *ngIf="recordacao.imagem && recordacao.imagem.trim() !== ''">
                    <div class="imagem-wrapper">
                        <img [src]="recordacao.imagem" alt="Preview da imagem" (error)="onImagemError($event)" />
                    </div>
                    <button type="button" class="btn-remover-imagem" (click)="removerImagem()" [disabled]="salvando" title="Remover imagem">
                        <span class="material-icons">close</span>
                    </button>
                </div>
                <div class="upload-area" *ngIf="!recordacao.imagem || recordacao.imagem.trim() === ''">
                    <input
                        type="file"
                        id="imagem"
                        name="imagem"
                        accept="image/webp,.webp"
                        (change)="onImagemChange($event)"
                        [disabled]="salvando"
                        class="file-input"
                    />
                    <label for="imagem" class="upload-label">
                        <span class="material-icons">upload</span>
                        <span>Clique para fazer upload ou arraste uma imagem</span>
                        <small>Apenas WEBP até 5MB</small>
                    </label>
                </div>
            </div>
        </div>

        <div class="form-actions">
            <button type="button" class="btn-secondary" (click)="voltar()" [disabled]="salvando">
                Cancelar
            </button>
            <button type="submit" class="btn-primary" [disabled]="salvando || !arquivoImagem">
                <span *ngIf="!salvando">Adicionar Recordação</span>
                <span *ngIf="salvando">
                    <span class="spinner-small"></span>
                    Salvando...
                </span>
            </button>
        </div>
    </form>
</div>

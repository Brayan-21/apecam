<div class="admin-layout">
    <aside class="admin-sidebar">
        <div class="brand">
            <img src="logo header laranja 2.0.png" alt="APECAM" />
            <h2>Painel Administrativo</h2>
        </div>

        <nav class="menu">
            <a
                class="menu-item"
                *ngFor="let item of menus"
                [routerLink]="item.route"
                routerLinkActive="active"
            >
                <span class="dot" aria-hidden="true"></span>
                <span class="label">{{ item.label }}</span>
            </a>
        </nav>
    </aside>

    <main class="admin-content">
        <button class="logout-fab" type="button" (click)="logout()" aria-label="Sair do painel">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 17l1.41-1.41L14.83 13H21v-2h-6.17l2.58-2.59L16 7l-5 5 5 5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14a2 2 0 002 2h8v-2H4V5z"/></svg>
            <span class="tooltip">Sair do painel</span>
        </button>

        <router-outlet></router-outlet>
    </main>
</div>

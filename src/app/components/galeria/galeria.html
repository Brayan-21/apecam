<section class="section">
	<div class="container">
		<h1 class="title is-3 has-text-centered">Nossas Recordações</h1>
		<p class="subtitle has-text-centered">Momentos que contam nossa história</p>

		<div class="gallery-grid" *ngIf="!carregando && recordacoes.length > 0">
			<ng-container *ngFor="let recordacao of recordacoes">
				<img
					*ngIf="temImagemValida(recordacao)"
					[src]="getImagemUrl(recordacao)"
					alt="Recordação APECAM"
					loading="lazy"
					(error)="onImagemError($event)"
					(click)="abrirImagemModal(recordacao)"
					style="cursor: pointer;"
				>
			</ng-container>
		</div>

		<div *ngIf="carregando" style="text-align: center; padding: 2rem;">
			<p>Carregando recordações...</p>
		</div>

		<div *ngIf="!carregando && recordacoes.length === 0" style="text-align: center; padding: 2rem;">
			<p>Nenhuma recordação disponível no momento.</p>
		</div>
	</div>
</section>

<!-- Modal de Imagem em Tela Cheia -->
<div class="image-modal-overlay" *ngIf="imagemModalShow" (click)="fecharImagemModal()">
	<div class="image-modal-container" (click)="$event.stopPropagation()">
		<button class="image-modal-close" (click)="fecharImagemModal()" type="button" aria-label="Fechar">
			<span class="material-icons">close</span>
		</button>
		<img [src]="imagemModalUrl" alt="Recordação em tela cheia" />
	</div>
</div>
